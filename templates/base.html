{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %}DevForge — web platform for managing game development{% endblock %}
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>

<body class="h-full text-slate-900 flex overflow-hidden">

{% include 'includes/sidebar.html' %}

<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
  <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 relative">
    {% block header %}{% endblock %}
  </header>

  <main class="flex-1 overflow-y-auto p-6">
    <div class="max-w-7xl mx-auto space-y-6">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>
</body>
</html>
