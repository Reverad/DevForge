{% if is_paginated %}
  <div class="flex items-center justify-center gap-2 pt-6">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}"
         class="px-3 py-1.5 bg-white border border-slate-200 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-50 transition-all">Previous</a>
    {% endif %}

    <span class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg">
          Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
        </span>

    {% if page_obj.has_next %}
      <a href="?page={{ page_obj.next_page_number }}"
         class="px-3 py-1.5 bg-white border border-slate-200 text-xs font-semibold rounded-lg text-slate-600 hover:bg-slate-50 transition-all">Next</a>
    {% endif %}
  </div>
{% endif %}
